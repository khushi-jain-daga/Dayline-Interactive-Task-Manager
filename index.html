<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dayline — Make time matter</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="#overview">dayline ✳</a><span class="credit">Developed by <b>Khushi Jain Daga</b><small>23bcon1665 · Experiment 03</small></span><button id="theme">◐ Theme</button></header><div class="shell"><aside><p class="eyebrow">YOUR WORKSPACE</p><nav id="nav" aria-label="Views"><button data-view="overview">◉ Overview</button><button data-view="tasks">☷ My tasks</button><button data-view="board">▥ Board</button><button data-view="calendar">▦ Calendar</button><button data-view="focus">◷ Focus</button></nav><div class="sidebottom"><p>Make room for good work.</p><button id="export">Export data ↓</button><label class="import">Import data ↑<input type="file" id="import" accept="application/json"></label></div></aside><main><div class="top"><div><p class="eyebrow" id="today"></p><h1 id="heading">Make time matter.</h1><p id="subtitle">A little progress goes a long way.</p></div><button class="primary" id="new">＋ New task</button></div><section id="content" aria-live="polite"></section></main></div><dialog id="editor"><form id="taskForm"><h2 id="formTitle">New task</h2><label>Task title<input name="title" required maxlength="120"></label><label>Category<input name="category" list="categories" required maxlength="40"><datalist id="categories"><option>College</option><option>Work</option><option>Personal</option></datalist></label><div class="split"><label>Priority<select name="priority"><option>Low</option><option>Medium</option><option>High</option></select></label><label>Status<select name="status"><option>To do</option><option>In progress</option><option>Completed</option></select></label></div><label>Due date<input type="date" name="due"></label><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary">Save task</button></div></form></dialog><p id="notice" role="status"></p><script src="script.js"></script></body></html>
